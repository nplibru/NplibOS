
 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NucleusOS — операционная система в браузере</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    :root {
        --bg: #1a1d23;
        --bg-2: #23272f;
        --bg-3: #2c313a;
        --accent: #4a9eff;
        --accent-2: #6bb5ff;
        --text: #e6e8eb;
        --text-dim: #8a9099;
        --border: #363b45;
        --danger: #ff5c5c;
        --success: #4ade80;
        --warn: #fbbf24;
        --window-bg: #23272f;
        --titlebar-bg: #2c313a;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', 'Inter', Roboto, Arial, sans-serif;
        font-size: 13px;
        background: #000;
        color: var(--text);
    }

    /* ============ ЗАГРУЗКА ============ */
    #boot {
        position: fixed;
        inset: 0;
        background: #0d0f12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Courier New', monospace;
    }

    #boot .logo {
        font-size: 56px;
        font-weight: 300;
        color: var(--text);
        letter-spacing: 6px;
        margin-bottom: 8px;
    }

    #boot .logo span { color: var(--accent); font-weight: 700; }
    #boot .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 40px; letter-spacing: 2px; }

    #boot .progress {
        width: 240px;
        height: 3px;
        background: #1a1d23;
        border-radius: 2px;
        overflow: hidden;
    }

    #boot .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        animation: load 2.4s ease-in-out forwards;
        border-radius: 2px;
    }

    @keyframes load {
        0% { width: 0%; }
        60% { width: 70%; }
        100% { width: 100%; }
    }

    #boot .log {
        margin-top: 20px;
        font-size: 11px;
        color: #4a5058;
        height: 16px;
        font-family: 'Courier New', monospace;
    }

    /* ============ РАБОЧИЙ СТОЛ ============ */
    #desktop {
        position: absolute;
        inset: 0;
        background: var(--bg);
        background-image:
            radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(74, 158, 255, 0.05) 0%, transparent 40%);
        overflow: hidden;
        display: none;
    }

    /* Верхняя панель */
    #topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 32px;
        background: rgba(35, 39, 47, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 12px;
        z-index: 9000;
        font-size: 12px;
    }

    #topbar .sys-name {
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 1px;
    }

    #topbar .menu-item {
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-dim);
        transition: all 0.15s;
    }

    #topbar .menu-item:hover {
        background: var(--bg-3);
        color: var(--text);
    }

    #topbar .spacer { flex: 1; }

    #topbar .sys-info {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text-dim);
        font-size: 11px;
    }

    #topbar .sys-info span { cursor: default; }

    #topbar .indicator {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 4px;
    }

    /* Иконки рабочего стола */
    #desktopIcons {
        position: absolute;
        top: 48px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .desk-icon {
        width: 84px;
        padding: 10px 6px;
        text-align: center;
        color: var(--text);
        cursor: pointer;
        border-radius: 8px;
        transition: background 0.15s;
        border: 1px solid transparent;
    }

    .desk-icon:hover {
        background: rgba(74, 158, 255, 0.12);
        border-color: rgba(74, 158, 255, 0.3);
    }

    .desk-icon.selected {
        background: rgba(74, 158, 255, 0.2);
        border-color: var(--accent);
    }

    .desk-icon .ico {
        font-size: 30px;
        line-height: 1;
        margin-bottom: 6px;
        display: block;
    }

    .desk-icon .lbl {
        font-size: 11px;
        word-wrap: break-word;
        line-height: 1.2;
    }

    /* Нижний док */
    #dock {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(35, 39, 47, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px 10px;
        display: flex;
        gap: 6px;
        z-index: 9000;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .dock-item {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.15s;
        background: var(--bg-3);
        position: relative;
    }

    .dock-item:hover {
        background: var(--accent);
        transform: translateY(-4px);
    }

    .dock-item .tooltip {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        background: #000;
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
    }

    .dock-item:hover .tooltip { opacity: 1; }

    /* Часы в доке */
    .dock-clock {
        padding: 0 12px;
        height: 40px;
        border-radius: 8px;
        background: var(--bg-3);
        display: flex;
        align-items: center;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }

    /* ============ ОКНА ============ */
    .window {
        position: absolute;
        background: var(--window-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        min-width: 200px;
        min-height: 100px;
        overflow: hidden;
        animation: winOpen 0.18s ease-out;
    }

    @keyframes winOpen {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
    }

    .window.active {
        border-color: var(--accent);
        box-shadow: 0 8px 40px rgba(74, 158, 255, 0.15), 0 0 0 1px rgba(74, 158, 255, 0.3);
    }

    .win-titlebar {
        height: 34px;
        background: var(--titlebar-bg);
        display: flex;
        align-items: center;
        padding: 0 8px 0 12px;
        cursor: move;
        border-bottom: 1px solid var(--border);
        gap: 8px;
    }

    .win-titlebar .win-icon {
        font-size: 15px;
        line-height: 1;
    }

    .win-titlebar .win-title {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .win-controls {
        display: flex;
        gap: 4px;
    }

    .win-btn {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-family: Arial, sans-serif;
        transition: all 0.15s;
    }

    .win-btn:hover {
        background: var(--bg-3);
        color: var(--text);
    }

    .win-btn.close:hover {
        background: var(--danger);
        color: #fff;
    }

    .win-content {
        flex: 1;
        overflow: auto;
        background: var(--window-bg);
        position: relative;
    }

    /* ============ ПРИЛОЖЕНИЯ ============ */

    /* Терминал */
    .terminal {
        background: #0d0f12;
        height: 100%;
        padding: 10px 12px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        color: #c8d0d8;
        overflow-y: auto;
        line-height: 1.5;
    }

    .terminal .line { white-space: pre-wrap; word-break: break-word; }
    .terminal .prompt { color: var(--accent); font-weight: bold; }
    .terminal .err { color: var(--danger); }
    .terminal .ok { color: var(--success); }
    .terminal .warn { color: var(--warn); }
    .terminal .dim { color: #5a6068; }
    .terminal .info { color: #a0d0ff; }

    .terminal-input-line {
        display: flex;
        align-items: center;
    }

    .terminal-input {
        flex: 1;
        background: transparent;
        border: none;
        color: #c8d0d8;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        outline: none;
        caret-color: var(--accent);
    }

    /* Калькулятор */
    .calc-app { padding: 10px; height: 100%; display: flex; flex-direction: column; }
    .calc-screen {
        background: #0d0f12;
        border-radius: 8px;
        padding: 12px 14px;
        text-align: right;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        font-weight: bold;
        color: var(--text);
        margin-bottom: 10px;
        min-height: 50px;
        overflow: hidden;
    }
    .calc-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
    }
    .calc-grid button {
        background: var(--bg-3);
        border: none;
        border-radius: 6px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.1s;
        font-family: inherit;
    }
    .calc-grid button:hover { background: #363b45; }
    .calc-grid button:active { transform: scale(0.96); }
    .calc-grid button.op { color: var(--accent); }
    .calc-grid button.eq { background: var(--accent); color: #fff; }
    .calc-grid button.eq:hover { background: var(--accent-2); }
    .calc-grid button.clear { color: var(--danger); }

    /* Блокнот */
    .notepad-area {
        width: 100%;
        height: 100%;
        background: #1a1d23;
        color: var(--text);
        border: none;
        outline: none;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        padding: 12px;
        resize: none;
        line-height: 1.5;
    }

    /* Проводник / файлы */
    .files-app { display: flex; height: 100%; }
    .files-sidebar {
        width: 160px;
        background: #1a1d23;
        border-right: 1px solid var(--border);
        padding: 10px 6px;
        overflow-y: auto;
    }
    .files-sidebar .fs-item {
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        transition: all 0.1s;
    }
    .files-sidebar .fs-item:hover { background: var(--bg-3); color: var(--text); }
    .files-sidebar .fs-item.active { background: var(--accent); color: #fff; }

    .files-main { flex: 1; padding: 12px; overflow-y: auto; }
    .files-path {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }
    .files-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 8px;
    }
    .file-item {
        padding: 10px 6px;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.1s;
        border: 1px solid transparent;
    }
    .file-item:hover {
        background: var(--bg-3);
        border-color: var(--border);
    }
    .file-item .fi-icon { font-size: 28px; margin-bottom: 4px; }
    .file-item .fi-name {
        font-size: 11px;
        word-wrap: break-word;
        line-height: 1.2;
        color: var(--text);
    }
    .file-item .fi-size { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

    /* Браузер */
    .browser-app { display: flex; flex-direction: column; height: 100%; background: #1a1d23; }
    .browser-bar {
        display: flex;
        gap: 6px;
        padding: 8px;
        background: var(--bg-3);
        border-bottom: 1px solid var(--border);
        align-items: center;
    }
    .browser-bar button {
        width: 28px; height: 28px;
        border-radius: 5px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
    }
    .browser-bar button:hover { background: var(--bg); }
    .browser-bar input {
        flex: 1;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px 10px;
        color: var(--text);
        font-size: 12px;
        outline: none;
        font-family: inherit;
    }
    .browser-bar input:focus { border-color: var(--accent); }
    .browser-frame {
        flex: 1;
        background: #fff;
        border: none;
        width: 100%;
    }
    .browser-warning {
        background: var(--warn);
        color: #000;
        padding: 6px 10px;
        font-size: 11px;
        text-align: center;
    }
    .browser-start {
        padding: 30px;
        color: var(--text);
        text-align: center;
    }
    .browser-start h3 { color: var(--accent); margin-bottom: 14px; font-size: 18px; }
    .browser-start p { color: var(--text-dim); margin-bottom: 8px; font-size: 12px; }
    .browser-start .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 16px;
    }
    .browser-start .quick-links button {
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
    }
    .browser-start .quick-links button:hover { border-color: var(--accent); color: var(--accent); }

    /* Часы */
    .clock-app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 10px;
    }
    .clock-time {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: bold;
        color: var(--accent);
        letter-spacing: 3px;
    }
    .clock-date { font-size: 15px; color: var(--text-dim); }

    /* Погода (эмуляция) */
    .weather-app { padding: 20px; text-align: center; height: 100%; }
    .weather-temp {
        font-size: 56px;
        font-weight: 300;
        color: var(--text);
        margin: 10px 0;
    }
    .weather-icon { font-size: 48px; }
    .weather-desc { color: var(--text-dim); margin-bottom: 14px; }
    .weather-details {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 16px;
        font-size: 12px;
        color: var(--text-dim);
    }

    /* Заметки */
    .sticky-app { padding: 12px; height: 100%; }
    .sticky-area {
        width: 100%;
        height: 100%;
        background: #2a2a1a;
        color: #ffe97a;
        border: 1px solid #4a4a2a;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        resize: none;
        outline: none;
        line-height: 1.5;
    }

    /* Игра "Змейка" */
    .snake-app { display: flex; flex-direction: column; align-items: center; padding: 10px; height: 100%; }
    .snake-stats { color: var(--text); font-size: 13px; margin-bottom: 8px; font-family: 'Courier New', monospace; }
    .snake-stats span { color: var(--accent); font-weight: bold; }
    .snake-canvas { background: #0d0f12; border: 1px solid var(--border); border-radius: 6px; }
    .snake-btns { margin-top: 8px; display: flex; gap: 6px; }
    .snake-btns button {
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
    }
    .snake-btns button:hover { border-color: var(--accent); color: var(--accent); }

    /* Настройки */
    .settings-app { padding: 16px; height: 100%; overflow-y: auto; }
    .settings-section {
        background: var(--bg-3);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 10px;
    }
    .settings-section h4 {
        font-size: 13px;
        color: var(--accent);
        margin-bottom: 8px;
    }
    .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row label { color: var(--text-dim); }
    .settings-row select, .settings-row input[type="range"] {
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-family: inherit;
    }
    .settings-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

    /* Справка */
    .help-app { padding: 16px; height: 100%; overflow-y: auto; line-height: 1.6; font-size: 13px; }
    .help-app h3 { color: var(--accent); margin: 12px 0 6px; font-size: 14px; }
    .help-app code {
        background: #0d0f12;
        padding: 1px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        color: var(--accent-2);
        font-size: 12px;
    }
    .help-app ul { margin-left: 18px; }
    .help-app li { margin-bottom: 4px; }

    /* Список процессов */
    .processes-app { padding: 12px; height: 100%; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; }
    .proc-row {
        display: grid;
        grid-template-columns: 40px 1fr 80px 80px;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        color: var(--text);
    }
    .proc-row.head { color: var(--text-dim); border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 6px; font-weight: bold; }
    .proc-row:hover:not(.head) { background: var(--bg-3); }
    .proc-row .pid { color: var(--accent); }
    .proc-row .mem { color: var(--warn); text-align: right; }

    /* Медиаплеер */
    .media-app { padding: 14px; height: 100%; display: flex; flex-direction: column; }
    .media-visual {
        flex: 1;
        background: #0d0f12;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        overflow: hidden;
        position: relative;
    }
    .media-bars {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 60%;
    }
    .media-bar {
        width: 10px;
        background: linear-gradient(to top, var(--accent), var(--accent-2));
        border-radius: 3px 3px 0 0;
        animation: barPulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes barPulse {
        from { height: 15%; }
        to { height: 100%; }
    }
    .media-info { text-align: center; margin-bottom: 10px; color: var(--text-dim); font-size: 12px; }
    .media-info .song { color: var(--text); font-size: 14px; font-weight: 600; }
    .media-controls { display: flex; justify-content: center; gap: 10px; }
    .media-controls button {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .media-controls button:hover { background: var(--accent); }
    .media-controls button.play { background: var(--accent); }

    /* Консоль-лаунчер (Ctrl+Space) */
    #launcher {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        background: var(--window-bg);
        border: 1px solid var(--accent);
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        z-index: 9500;
        display: none;
        overflow: hidden;
    }
    #launcher.open { display: block; }
    #launcher input {
        width: 100%;
        padding: 14px 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 15px;
        outline: none;
        border-bottom: 1px solid var(--border);
        font-family: inherit;
    }
    #launcherResults { max-height: 300px; overflow-y: auto; }
    .launcher-item {
        padding: 10px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
    }
    .launcher-item:hover, .launcher-item.selected { background: var(--accent); color: #fff; }

    /* Контекстное меню */
    #contextMenu {
        position: absolute;
        background: var(--window-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        padding: 4px;
        z-index: 9600;
        display: none;
        min-width: 160px;
    }
    #contextMenu.open { display: block; }
    .ctx-item {
        padding: 6px 12px;

    /* Уведомления */

        #dock { padding: 4px 6px; }
        .dock-item { width: 36px; height: 36px; font-size: 17px; }

</style>
</head>

<script>
/* ============================================================
   NucleusOS — операционная система в браузере
   Свой дизайн, свой оконный менеджер, свой терминал,
   своя файловая система, свой браузер.
   ============================================================ */

/* ---------- ФАЙЛОВАЯ СИСТЕМА ---------- */
const FS = {
    '/': {
        type: 'dir',
        children: {
            'home': {
                type: 'dir',
                children: {
                    'user': {
                        type: 'dir',
                        children: {
                            'readme.txt': { type: 'file', content: 'Добро пожаловать в NucleusOS!\n\nЭто ваша домашняя папка.\nФайлы можно создавать через терминал:\n  touch имя_файла\n  write имя_файла текст\n  cat имя_файла', size: 180 },
                            'notes.txt': { type: 'file', content: 'Заметки на память:\n- купить хлеб\n- выучить JavaScript\n- написать свою ОС', size: 90 },

                        }
                    }
                }
            },
            'system': {
                type: 'dir',
                children: {
                    'kernel.bin': { type: 'file', content: '[бинарные данные ядра]', size: 4096 },
                    'config.sys': { type: 'file', content: 'boot=auto\nshell=terminal\ntheme=dark', size: 64 },
                    'version.txt': { type: 'file', content: 'NucleusOS 1.0\nBuild 2025.05\nJS Kernel', size: 48 }
                }
            },
            'programs': {
                type: 'dir',
                children: {

                    'calculator.app': { type: 'file', content: '[приложение]', size: 192 },
                    'browser.app': { type: 'file', content: '[приложение]', size: 512 },
                    'files.app': { type: 'file', content: '[приложение]', size: 320 }
                }
            },
            'tmp': { type: 'dir', children: {} }
        }
    }
};

let CWD = '/home/user';

/* ---------- РЕЕСТР ПРИЛОЖЕНИЙ ---------- */
const APPS = {
    terminal:  { name: 'Терминал',      icon: '▶',  fn: openTerminal,    w: 620, h: 400 },
    files:     { name: 'Файлы',         icon: '📁', fn: openFiles,       w: 620, h: 420 },
    calculator:{ name: 'Калькулятор',   icon: '🧮', fn: openCalculator,  w: 280, h: 380 },
    notepad:   { name: 'Блокнот',       icon: '📝', fn: openNotepad,     w: 560, h: 400 },
    browser:   { name: 'Браузер',       icon: '🌐', fn: openBrowser,     w: 800, h: 560 },
    clock:     { name: 'Часы',          icon: '🕐', fn: openClock,       w: 340, h: 220 },
    weather:   { name: 'Погода',        icon: '☁️', fn: openWeather,     w: 340, h: 320 },
    sticky:    { name: 'Заметки',       icon: '📌', fn: openSticky,      w: 400, h: 340 },
    snake:     { name: 'Змейка',        icon: '🐍', fn: openSnake,       w: 460, h: 560 },
    settings:  { name: 'Настройки',     icon: '⚙️', fn: openSettings,    w: 480, h: 480 },
    help:      { name: 'Справка',       icon: '❓', fn: openHelp,        w: 560, h: 480 },
    about:     { name: 'О системе',     icon: 'ℹ️', fn: openAbout,       w: 380, h: 340 },
    processes: { name: 'Процессы',      icon: '📊', fn: openProcesses,   w: 560, h: 420 },
    media:     { name: 'Медиаплеер',    icon: '🎵', fn: openMedia,       w: 420, h: 480 },
    camera:    { name: 'Камера',        icon: '📷', fn: openCamera,      w: 520, h: 440 }
};

/* ---------- ИКОНКИ РАБОЧЕГО СТОЛА ---------- */
const DESKTOP_ICONS = [
    { app: 'files',     label: 'Файлы' },
    { app: 'terminal',  label: 'Терминал' },
    { app: 'browser',   label: 'Браузер' },
    { app: 'notepad',   label: 'Блокнот' },
    { app: 'calculator',label: 'Калькулятор' },
    { app: 'snake',     label: 'Змейка' },
    { app: 'settings',  label: 'Настройки' },
    { app: 'about',     label: 'О системе' }
];

/* ---------- ДОК ---------- */
const DOCK_ITEMS = ['files', 'terminal', 'browser', 'notepad', 'calculator', 'snake', 'media', 'camera', 'settings'];

/* ---------- СОСТОЯНИЕ ОКОН ---------- */
const windows = {};
let winCounter = 0;
let winZIndex = 100;
let activeWinId = null;
let currentTheme = 'dark';
let wallpaperIndex = 0;

const WALLPAPERS = [
    { name: 'Тёмный', css: 'radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(74, 158, 255, 0.05) 0%, transparent 40%)' },
    { name: 'Закат', css: 'radial-gradient(circle at 30% 70%, rgba(255, 100, 50, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 200, 50, 0.1) 0%, transparent 50%)' },
    { name: 'Лес', css: 'radial-gradient(circle at 50% 80%, rgba(50, 200, 100, 0.12) 0%, transparent 50%), radial-gradient(circle at 20% 20%, rgba(50, 150, 100, 0.08) 0%, transparent 50%)' },
    { name: 'Космос', css: 'radial-gradient(circle at 15% 25%, rgba(150, 80, 255, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 75%, rgba(50, 100, 255, 0.1) 0%, transparent 40%)' },
    { name: 'Минимал', css: 'none' }
];

/* ============================================================
   ЗАГРУЗКА СИСТЕМЫ
   ============================================================ */
const bootMessages = [
    'инициализация ядра...',
    'загрузка драйверов...',
    'монтирование файловой системы...',
    'запуск оконного менеджера...',
    'загрузка приложений...',
    'система готова.'
];

function runBoot() {
    let i = 0;
    const log = document.getElementById('bootLog');
    const interval = setInterval(() => {
        if (i < bootMessages.length) {
            log.textContent = bootMessages[i++];
        } else {
            clearInterval(interval);
        }
    }, 350);

    setTimeout(() => {
        document.getElementById('boot').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
        initDesktop();
        initDock();
        updateTopClock();
        setInterval(updateTopClock, 1000);
        updateRam();
        setInterval(updateRam, 3000);
        notify('NucleusOS', 'Система успешно загружена. Добро пожаловать!');
        setTimeout(() => openApp('about'), 500);
    }, 2400);
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ РАБОЧЕГО СТОЛА
   ============================================================ */
function initDesktop() {
    const container = document.getElementById('desktopIcons');
    container.innerHTML = '';
    DESKTOP_ICONS.forEach(item => {
        const app = APPS[item.app];
        const el = document.createElement('div');
        el.className = 'desk-icon';
        el.innerHTML = `<span class="ico">${app.icon}</span><span class="lbl">${item.label}</span>`;
        el.addEventListener('dblclick', () => openApp(item.app));
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.desk-icon').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
        });
        container.appendChild(el);
    });

    // клик по пустому месту — снять выделение
    document.getElementById('desktop').addEventListener('click', (e) => {
        if (e.target.id === 'desktop') {
            document.querySelectorAll('.desk-icon').forEach(i => i.classList.remove('selected'));
        }
        hideContextMenu();
    });

    // контекстное меню на рабочем столе
    document.getElementById('desktop').addEventListener('contextmenu', (e) => {
        if (e.target.id === 'desktop') {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, [
                { icon: '📁', label: 'Открыть файлы', action: () => openApp('files') },
                { icon: '▶', label: 'Открыть терминал', action: () => openApp('terminal') },
                { sep: true },
                { icon: '🔄', label: 'Обновить', action: () => { closeAllWindows(); notify('Система', 'Рабочий стол обновлён'); } },
                { icon: '🖼️', label: 'Сменить обои', action: nextWallpaper },
                { icon: '⚙️', label: 'Настройки', action: () => openApp('settings') }
            ]);
        }
    });
}

function initDock() {
    const dock = document.getElementById('dock');
    dock.innerHTML = '';
    DOCK_ITEMS.forEach(id => {
        const app = APPS[id];
        const el = document.createElement('div');
        el.className = 'dock-item';
        el.innerHTML = `${app.icon}<span class="tooltip">${app.name}</span>`;
        el.addEventListener('click', () => openApp(id));
        dock.appendChild(el);
    });

    // часы в доке
    const clock = document.createElement('div');
    clock.className = 'dock-clock';
    clock.id = 'dockClock';
    clock.textContent = '00:00';
    dock.appendChild(clock);
    updateDockClock();
    setInterval(updateDockClock, 10000);

    // приветствие в доке
    const greet = document.createElement('div');
    greet.className = 'dock-clock';
    greet.innerHTML = '👋 <span style="color:var(--text-dim); font-size:11px; margin-left:4px;">добро пожаловать</span>';
    dock.appendChild(greet);
}

function updateDockClock() {
    const now = new Date();
    const el = document.getElementById('dockClock');
    if (el) el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

function updateTopClock() {
    const now = new Date();
    const el = document.getElementById('topClock');
    if (el) el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
}

function updateRam() {
    const el = document.getElementById('topRam');
    if (!el) return;
    // эмуляция: базовое 128 МБ + случайные колебания
    const base = 128 + Object.keys(windows).length * 32 + Math.floor(Math.random() * 40);
    el.textContent = `RAM: ${base} МБ`;
}

/* ============================================================
   ОКОННЫЙ МЕНЕДЖЕР
   ============================================================ */
function openApp(appId) {
    const app = APPS[appId];
    if (!app) {
        notify('Ошибка', 'Приложение "' + appId + '" не найдено');
        return;
    }
    app.fn();
}

function createWindow(opts) {
    const id = 'win-' + (++winCounter);
    const w = opts.width || 500;
    const h = opts.height || 350;
    const offset = (winCounter % 8) * 22;
    const x = Math.min(window.innerWidth - w - 20, 80 + offset);
    const y = Math.min(window.innerHeight - h - 80, 60 + offset);

    const el = document.createElement('div');
    el.className = 'window active';
    el.id = id;
    el.style.cssText = `left:${x}px; top:${y}px; width:${w}px; height:${h}px; z-index:${++winZIndex};`;

    el.innerHTML = `
        <div class="win-titlebar">
            <span class="win-icon">${opts.icon || '📦'}</span>
            <span class="win-title">${opts.title || 'Окно'}</span>
            <div class="win-controls">
                <button class="win-btn" data-act="min" title="Свернуть">−</button>
                <button class="win-btn" data-act="max" title="Развернуть">□</button>
                <button class="win-btn close" data-act="close" title="Закрыть">✕</button>
            </div>
        </div>
        <div class="win-content">${opts.content || ''}</div>
    `;

    document.getElementById('desktop').appendChild(el);

    el.querySelector('[data-act="close"]').onclick = (e) => { e.stopPropagation(); closeWindow(id); };
    el.querySelector('[data-act="min"]').onclick = (e) => { e.stopPropagation(); minimizeWindow(id); };
    el.querySelector('[data-act="max"]').onclick = (e) => { e.stopPropagation(); toggleMaximize(id); };
    el.addEventListener('mousedown', () => focusWindow(id));
    el.querySelector('.win-titlebar').addEventListener('dblclick', () => toggleMaximize(id));

    makeDraggable(el, el.querySelector('.win-titlebar'));

    windows[id] = { el, id, title: opts.title, icon: opts.icon, minimized: false, maximized: false, appId: opts.appId };
    focusWindow(id);
    updateRam();
    return id;
}

function makeDraggable(win, handle) {
    let sx, sy, ox, oy, drag = false;
    handle.addEventListener('mousedown', (e) => {
        if (e.target.closest('.win-btn')) return;
        if (windows[win.id] && windows[win.id].maximized) return;
        drag = true;
        sx = e.clientX; sy = e.clientY;
        ox = win.offsetLeft; oy = win.offsetTop;
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        const nx = Math.max(0, Math.min(window.innerWidth - 80, ox + e.clientX - sx));
        const ny = Math.max(40, Math.min(window.innerHeight - 60, oy + e.clientY - sy));
        win.style.left = nx + 'px';
        win.style.top = ny + 'px';
    });
    document.addEventListener('mouseup', () => { drag = false; });
}

function closeWindow(id) {
    const w = windows[id];
    if (!w) return;
    w.el.style.animation = 'winOpen 0.15s reverse';
    setTimeout(() => {
        w.el.remove();
        delete windows[id];
        if (activeWinId === id) {
            const ids = Object.keys(windows);
            if (ids.length) focusWindow(ids[ids.length - 1]);
            else activeWinId = null;
        }
        updateRam();
    }, 120);
}

function minimizeWindow(id) {
    const w = windows[id];
    if (!w) return;
    w.minimized = true;
    w.el.style.display = 'none';
}

function toggleMaximize(id) {
    const w = windows[id];
    if (!w) return;
    if (w.maximized) {
        w.el.style.cssText = `left:${w.prevLeft}; top:${w.prevTop}; width:${w.prevWidth}; height:${w.prevHeight}; z-index:${++winZIndex};`;
        w.maximized = false;
    } else {
        w.prevLeft = w.el.style.left;
        w.prevTop = w.el.style.top;
        w.prevWidth = w.el.style.width;
        w.prevHeight = w.el.style.height;
        w.el.style.cssText = `left:0; top:32px; width:100%; height:calc(100% - 32px); z-index:${++winZIndex};`;
        w.maximized = true;
    }
}

function focusWindow(id) {
    const w = windows[id];
    if (!w) return;
    if (w.minimized) {
        w.minimized = false;
        w.el.style.display = 'flex';
    }
    activeWinId = id;
    w.el.style.zIndex = ++winZIndex;
    Object.values(windows).forEach(o => o.el.classList.remove('active'));
    w.el.classList.add('active');
}

function closeAllWindows() {
    Object.keys(windows).forEach(id => closeWindow(id));
}

/* ============================================================
   ПРИЛОЖЕНИЕ: ТЕРМИНАЛ (с реальной работой)
   ============================================================ */
function openTerminal() {
    const content = `
        <div class="terminal" id="termBody">
            <div class="line">NucleusOS Terminal v1.0</div>
            <div class="line dim">Введите <span class="info">help</span> для списка команд.</div>
            <div class="line">&nbsp;</div>
            <div id="termOutput"></div>
            <div class="terminal-input-line">
                <span class="prompt" id="termPrompt">user@nucleus:${CWD}$ </span>
                <input type="text" class="terminal-input" id="termInput" autocomplete="off" spellcheck="false">
            </div>
        </div>
    `;
    const id = createWindow({ title: 'Терминал', icon: '▶', content, width: 640, height: 420, appId: 'terminal' });

    setTimeout(() => {
        const input = document.getElementById('termInput');
        if (!input) return;
        input.focus();
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.value = '';
                termExec(cmd);
            } else if (e.key === 'ArrowUp') {
                // история команд
                e.preventDefault();
                if (termHistory.length) {
                    termHistoryIdx = Math.max(0, termHistoryIdx - 1);
                    input.value = termHistory[termHistoryIdx] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (termHistory.length) {
                    termHistoryIdx = Math.min(termHistory.length, termHistoryIdx + 1);
                    input.value = termHistory[termHistoryIdx] || '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                // автодополнение
                const parts = input.value.split(' ');
                if (parts.length === 1) {
                    const matches = Object.keys(TERM_COMMANDS).filter(c => c.startsWith(parts[0]));
                    if (matches.length === 1) input.value = matches[0] + ' ';
                }
            }
        });
        // клик по терминалу — фокус на input
        document.getElementById('termBody').addEventListener('click', () => input.focus());
    }, 50);
}

let termHistory = [];
let termHistoryIdx = 0;

const TERM_COMMANDS = {
    help:      'показать этот список',
    ls:        'список файлов в текущей папке',
    cd:        'сменить папку (cd /path)',
    pwd:       'показать текущий путь',
    cat:       'показать содержимое файла',
    touch:     'создать пустой файл',
    write:     'записать текст в файл',
    rm:        'удалить файл',
    mkdir:     'создать папку',
    echo:      'вывести текст',
    date:      'текущая дата и время',
    whoami:    'имя пользователя',
    uname:     'информация о системе',
    clear:     'очистить экран',
    history:   'история команд',
    df:        'свободное место',
    free:      'использование памяти',
    ps:        'список процессов',
    open:      'открыть приложение (open terminal)',
    exit:      'закрыть терминал',
    reboot:    'перезагрузить систему',
    neofetch:  'информация о системе (красиво)'
};

function termExec(cmd) {
    const output = document.getElementById('termOutput');
    const body = document.getElementById('termBody');
    if (!output) return;

    // эхо команды
    const echo = document.createElement('div');
    echo.className = 'line';
    echo.innerHTML = `<span class="prompt">user@nucleus:${CWD}$</span> ${escapeHtml(cmd)}`;
    output.appendChild(echo);

    const trimmed = cmd.trim();
    if (!trimmed) {
        // пустая команда — просто новая строка
        output.appendChild(document.createElement('div')).className = 'line';
        scrollTerm();
        return;
    }

    termHistory.push(trimmed);
    termHistoryIdx = termHistory.length;

    const parts = trimmed.split(/\s+/);
    const command = parts[0].toLowerCase();
    const args = parts.slice(1);

    const result = document.createElement('div');
    result.className = 'line';

    let handled = true;

    switch (command) {
        case 'help':
            result.innerHTML = '<span class="info">Доступные команды:</span>\n' +
                Object.entries(TERM_COMMANDS).map(([c, d]) => `  <span class="ok">${c.padEnd(10)}</span> — ${d}`).join('\n');
            result.style.whiteSpace = 'pre';
            break;

        case 'ls': {
            const node = fsResolve(CWD);
            if (!node || node.type !== 'dir') {
                result.innerHTML = '<span class="err">Не удалось прочитать папку</span>';
                break;
            }
            const names = Object.keys(node.children || {});
            if (!names.length) {
                result.innerHTML = '<span class="dim">(пусто)</span>';
                break;
            }
            result.innerHTML = names.map(n => {
                const c = node.children[n];
                return c.type === 'dir' ? `<span class="info">${n}/</span>` : `<span class="ok">${n}</span>`;
            }).join('  ');
            break;
        }

        case 'cd': {
            if (!args[0] || args[0] === '~') {
                CWD = '/home/user';
            } else if (args[0] === '..') {
                const parts2 = CWD.split('/').filter(Boolean);
                parts2.pop();
                CWD = '/' + parts2.join('/');
                if (!CWD) CWD = '/';
            } else if (args[0] === '/') {
                CWD = '/';
            } else if (args[0].startsWith('/')) {
                if (fsResolve(args[0])?.type === 'dir') CWD = args[0];
                else { result.innerHTML = '<span class="err">Папка не найдена</span>'; break; }
            } else {
                const target = (CWD === '/' ? '' : CWD) + '/' + args[0];
                if (fsResolve(target)?.type === 'dir') CWD = target;
                else { result.innerHTML = '<span class="err">Папка не найдена</span>'; break; }
            }
            updateTermPrompt();
            result.innerHTML = '';
            break;
        }

        case 'pwd':
            result.textContent = CWD;
            break;

        case 'cat': {
            if (!args[0]) { result.innerHTML = '<span class="err">Укажите файл: cat имя_файла</span>'; break; }
            const f = fsResolve(joinPath(CWD, args[0]));
            if (!f) { result.innerHTML = '<span class="err">Файл не найден</span>'; break; }
            if (f.type === 'dir') { result.innerHTML = '<span class="err">Это папка</span>'; break; }
            result.textContent = f.content || '';
            result.style.whiteSpace = 'pre-wrap';
            break;
        }

        case 'touch': {
            if (!args[0]) { result.innerHTML = '<span class="err">Укажите имя: touch имя_файла</span>'; break; }
            const parent = fsResolve(CWD);
            if (!parent || parent.type !== 'dir') { result.innerHTML = '<span class="err">Ошибка</span>'; break; }
            if (parent.children[args[0]]) { result.innerHTML = '<span class="warn">Файл уже существует</span>'; break; }
            parent.children[args[0]] = { type: 'file', content: '', size: 0 };
            result.innerHTML = `<span class="ok">Файл создан:</span> ${escapeHtml(args[0])}`;
            refreshFilesWindow();
            break;
        }

        case 'write': {
            if (args.length < 2) { result.innerHTML = '<span class="err">Использование: write файл текст</span>'; break; }
            const fileName = args[0];
            const text = args.slice(1).join(' ');
            const parent = fsResolve(CWD);
            if (parent.children[fileName] && parent.children[fileName].type === 'file') {
                parent.children[fileName].content = text;
                parent.children[fileName].size = text.length;
                result.innerHTML = `<span class="ok">Записано в ${escapeHtml(fileName)}</span>`;
                refreshFilesWindow();
            } else {
                result.innerHTML = '<span class="err">Файл не найден. Сначала touch.</span>';
            }
            break;
        }

        case 'rm': {
            if (!args[0]) { result.innerHTML = '<span class="err">Укажите файл: rm имя_файла</span>'; break; }
            const parent = fsResolve(CWD);
            if (parent.children[args[0]]) {
                delete parent.children[args[0]];
                result.innerHTML = `<span class="ok">Удалено:</span> ${escapeHtml(args[0])}`;
                refreshFilesWindow();
            } else {
                result.innerHTML = '<span class="err">Файл не найден</span>';
            }
            break;
        }

        case 'mkdir': {
            if (!args[0]) { result.innerHTML = '<span class="err">Укажите имя папки</span>'; break; }
            const parent = fsResolve(CWD);
            if (parent.children[args[0]]) { result.innerHTML = '<span class="warn">Уже существует</span>'; break; }
            parent.children[args[0]] = { type: 'dir', children: {} };
            result.innerHTML = `<span class="ok">Папка создана:</span> ${escapeHtml(args[0])}`;
            refreshFilesWindow();
            break;
        }

        case 'echo':
            result.textContent = args.join(' ');
            break;

        case 'date':
            result.textContent = new Date().toLocaleString('ru-RU');
            break;

        case 'whoami':
            result.textContent = 'user';
            break;

        case 'uname':
            result.textContent = 'NucleusOS 1.0 (JavaScript Kernel)';
            break;

        case 'clear':
            output.innerHTML = '';
            scrollTerm();
            return;

        case 'history':
            result.innerHTML = termHistory.map((h, i) => `  ${i + 1}  ${escapeHtml(h)}`).join('\n');
            result.style.whiteSpace = 'pre';
            break;

        case 'df': {
            const used = JSON.stringify(FS).length;
            result.innerHTML = `Файловая система: <span class="ok">nucleusfs</span>\nВсего: <span class="info">64 МБ</span>\nИспользовано: <span class="warn">${(used / 1024).toFixed(1)} КБ</span>\nСвободно: <span class="ok">${(64 - used / 1024 / 1024).toFixed(1)} МБ</span>`;
            result.style.whiteSpace = 'pre';
            break;
        }

        case 'free': {
            const used = 128 + Object.keys(windows).length * 32;
            result.innerHTML = `              всего     занято    свободно\nMem:          512 МБ    ${used} МБ    ${512 - used} МБ\nSwap:         256 МБ    0 МБ      256 МБ`;
            result.style.whiteSpace = 'pre';
            break;
        }

        case 'ps':
            result.innerHTML = '  PID  ИМЯ\n' +
                Object.entries(windows).map(([id, w], i) => `  ${String(100 + i).padStart(4)}  ${w.appId || 'window'}`).join('\n');
            result.style.whiteSpace = 'pre';
            break;

        case 'open':
            if (args[0] && APPS[args[0]]) {
                openApp(args[0]);
                result.innerHTML = `<span class="ok">Запуск:</span> ${args[0]}`;
            } else {
                result.innerHTML = '<span class="err">Приложение не найдено. Доступные: ' + Object.keys(APPS).join(', ') + '</span>';
            }
            break;

        case 'exit':
            result.textContent = 'Закрытие...';
            setTimeout(() => { if (activeWinId) closeWindow(activeWinId); }, 300);
            break;

        case 'reboot':
            result.textContent = 'Перезагрузка...';
            setTimeout(() => location.reload(), 500);
            break;

        case 'neofetch':
            result.innerHTML = `
<span class="info">        user@nucleus</span>
<span class="info">        ------------</span>
<span class="ok">OS:</span>      NucleusOS 1.0
<span class="ok">Kernel:</span>  JavaScript ES6+
<span class="ok">Shell:</span>   nsh 1.0
<span class="ok">WM:</span>      NucleusWM
<span class="ok">RAM:</span>     ${128 + Object.keys(windows).length * 32} МБ / 512 МБ
<span class="ok">Uptime:</span>  ${Math.floor(performance.now() / 1000)} сек
<span class="ok">Windows:</span> ${Object.keys(windows).length} открыто`;
            result.style.whiteSpace = 'pre';
            break;

        default:
            result.innerHTML = `<span class="err">Команда не найдена:</span> ${escapeHtml(command)}. Введите <span class="info">help</span>.`;
    }

    if (result.textContent || result.innerHTML) output.appendChild(result);
    scrollTerm();
}

function scrollTerm() {
    const b = document.getElementById('termBody');
    if (b) b.scrollTop = b.scrollHeight;
}

function updateTermPrompt() {
    const p = document.getElementById('termPrompt');
    if (p) p.textContent = `user@nucleus:${CWD}$ `;
}

function joinPath(base, rel) {
    if (rel.startsWith('/')) return rel;
    if (base === '/') return '/' + rel;
    return base + '/' + rel;
}

function fsResolve(path) {
    if (!path) return null;
    const parts = path.split('/').filter(Boolean);
    let node = FS['/'];
    for (const p of parts) {
        if (!node.children || !node.children[p]) return null;
        node = node.children[p];
    }
    return node;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
}

let filesWindowId = null;
function openFiles() {
    const content = `
        <div class="files-app">
            <div class="files-sidebar">
                <div class="fs-item" onclick="filesNav('/')">💾 / — корень</div>
                <div class="fs-item" onclick="filesNav('/home/user')">🏠 /home/user</div>
                <div class="fs-item" onclick="filesNav('/system')">⚙️ /system</div>
                <div class="fs-item" onclick="filesNav('/programs')">📦 /programs</div>
                <div class="fs-item" onclick="filesNav('/tmp')">🗑️ /tmp</div>
                <div class="fs-item" onclick="filesNav('/home/user/projects')">📁 projects</div>
            </div>
            <div class="files-main">
                <div class="files-path" id="filesPath">${CWD}</div>
                <div class="files-grid" id="filesGrid"></div>
            </div>
        </div>
    `;
    const id = createWindow({ title: 'Файлы', icon: '📁', content, width: 640, height: 440, appId: 'files' });
    filesWindowId = id;
    setTimeout(() => filesNav(CWD), 50);
}

function filesNav(path) {
    const node = fsResolve(path);
    if (!node || node.type !== 'dir') { notify('Файлы', 'Папка не найдена'); return; }
    CWD = path;
    const pathEl = document.getElementById('filesPath');
    const grid = document.getElementById('filesGrid');
    if (!pathEl || !grid) return;
    pathEl.textContent = path;
    grid.innerHTML = '';
    const entries = Object.entries(node.children || {});
    if (!entries.length) {
        grid.innerHTML = '<div style="color:var(--text-dim); grid-column: 1/-1;">Папка пуста</div>';
        return;
    }
    entries.forEach(([name, item]) => {
        const el = document.createElement('div');
        el.className = 'file-item';
        const isDir = item.type === 'dir';
        el.innerHTML = `
            <div class="fi-icon">${isDir ? '📁' : guessFileIcon(name)}</div>
            <div class="fi-name">${escapeHtml(name)}</div>
            ${!isDir ? `<div class="fi-size">${item.size || 0} Б</div>` : ''}
        `;
        el.ondblclick = () => {
            if (isDir) {
                filesNav(path === '/' ? '/' + name : path + '/' + name);
            } else {
                // открыть в блокноте
                openNotepad(name, item.content || '');
            }
        };
        grid.appendChild(el);
    });
}

function guessFileIcon(name) {
    if (name.endsWith('.txt')) return '📄';
    if (name.endsWith('.bin')) return '⚙️';
    if (name.endsWith('.app')) return '📦';
    if (name.endsWith('.sys')) return '🔧';
    return '📄';
}

function refreshFilesWindow() {
    if (filesWindowId && windows[filesWindowId]) {
        const pathEl = document.getElementById('filesPath');
        if (pathEl) filesNav(pathEl.textContent);
    }
}

let calcState = { display: '0', prev: null, op: null, resetNext: false };

function openCalculator() {
    const content = `
        <div class="calc-app">
            <div class="calc-screen" id="calcScreen">0</div>
            <div class="calc-grid">
                <button class="clear" onclick="calcPress('C')">C</button>
                <button onclick="calcPress('±')">±</button>
                <button onclick="calcPress('%')">%</button>
                <button class="op" onclick="calcPress('/')">÷</button>
                <button onclick="calcPress('7')">7</button>
                <button onclick="calcPress('8')">8</button>
                <button onclick="calcPress('9')">9</button>
                <button class="op" onclick="calcPress('*')">×</button>
                <button onclick="calcPress('4')">4</button>
                <button onclick="calcPress('5')">5</button>
                <button onclick="calcPress('6')">6</button>
                <button class="op" onclick="calcPress('-')">−</button>
                <button onclick="calcPress('1')">1</button>
                <button onclick="calcPress('2')">2</button>
                <button onclick="calcPress('3')">3</button>
                <button class="op" onclick="calcPress('+')">+</button>
                <button onclick="calcPress('0')" style="grid-column: span 2;">0</button>
                <button onclick="calcPress('.')">,</button>
                <button class="eq" onclick="calcPress('=')">=</button>
            </div>
        </div>
    `;
    calcState = { display: '0', prev: null, op: null, resetNext: false };
    createWindow({ title: 'Калькулятор', icon: '🧮', content, width: 280, height: 400, appId: 'calculator' });
}

function calcPress(v) {
    const s = calcState;
    if (v === 'C') { calcState = { display: '0', prev: null, op: null, resetNext: false }; updateCalc(); return; }
    if (v === '±') { s.display = (parseFloat(s.display) * -1).toString(); updateCalc(); return; }
    if (v === '%') { s.display = (parseFloat(s.display) / 100).toString(); updateCalc(); return; }
    if (['+', '-', '*', '/'].includes(v)) {
        if (s.op && !s.resetNext) { s.display = String(doCalc(s.prev, s.display, s.op)); }
        s.prev = s.display;
        s.op = v;
        s.resetNext = true;
        updateCalc();
        return;
    }
    if (v === '=') {
        if (s.op) {
            s.display = String(doCalc(s.prev, s.display, s.op));
            s.prev = null; s.op = null; s.resetNext = true;
        }
        updateCalc();
        return;
    }
    if (v === '.') {
        if (s.resetNext) { s.display = '0'; s.resetNext = false; }
        if (!s.display.includes('.')) s.display += '.';
        updateCalc();
        return;
    }
    if (s.resetNext || s.display === '0') { s.display = v; s.resetNext = false; }
    else s.display += v;
    updateCalc();
}

function doCalc(a, b, op) {
    const x = parseFloat(a), y = parseFloat(b);
    let r;
    switch (op) {
        case '+': r = x + y; break;
        case '-': r = x - y; break;
        case '*': r = x * y; break;
        case '/': r = y === 0 ? 'Ошибка' : x / y; break;
        default: r = y;
    }
    return typeof r === 'number' ? parseFloat(r.toFixed(10)) : r;
}

function updateCalc() {
    const el = document.getElementById('calcScreen');
    if (el) el.textContent = calcState.display;
}

const browserHistory = [];
let browserHistoryIdx = -1;

function browserGo() {
    const input = document.getElementById('browserUrl');
    let url = input.value.trim();
    if (!url) return;
    // если это не URL — превращаем в поиск
    if (!/^https?:\/\//i.test(url) && !/^about:/i.test(url)) {
        if (url.includes('.') && !url.includes(' ')) {
            url = 'https://' + url;
        } else {
            url = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(url);
        }
    }
    browserLoad(url);
}

function browserLoad(url) {
    const frame = document.getElementById('browserFrame');
    const input = document.getElementById('browserUrl');
    const start = document.getElementById('browserStart');
    const warn = document.getElementById('browserWarning');
    if (!frame) return;
    input.value = url;
    start.style.display = 'none';
    warn.style.display = 'block';
    frame.src = url;
    browserHistory.push(url);
    browserHistoryIdx = browserHistory.length - 1;
    notify('Браузер', 'Загрузка: ' + url.substring(0, 50));
}

function browserBack() {
    if (browserHistoryIdx > 0) {
        browserHistoryIdx--;
        const url = browserHistory[browserHistoryIdx];
        document.getElementById('browserUrl').value = url;
        document.getElementById('browserFrame').src = url;
    }
}

function browserForward() {
    if (browserHistoryIdx < browserHistory.length - 1) {
        browserHistoryIdx++;
        const url = browserHistory[browserHistoryIdx];
        document.getElementById('browserUrl').value = url;
        document.getElementById('browserFrame').src = url;
    }
}

function browserReload() {
    const frame = document.getElementById('browserFrame');
    if (frame) frame.src = frame.src;
}

function browserHome() {
    const start = document.getElementById('browserStart');
    const frame = document.getElementById('browserFrame');
    const input = document.getElementById('browserUrl');
    const warn = document.getElementById('browserWarning');
    if (start) start.style.display = 'block';
    if (frame) frame.src = 'about:blank';
    if (input) input.value = '';
    if (warn) warn.style.display = 'none';
}

                <button onclick="snakeReset()">🔄 Сброс</button>
            </div>
        </div>
    `;
    createWindow({ title: 'Змейка', icon: '🐍', content, width: 420, height: 500, appId: 'snake' });
    setTimeout(snakeInit, 50);
}

function snakeInit() {
    const canvas = document.getElementById('snakeCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const CELL = 18;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;
    const best = parseInt(localStorage.getItem('nucleus_snake_best') || '0');
    document.getElementById('snakeBest').textContent = best;

    snakeState = {
        canvas, ctx, CELL, COLS, ROWS,
        snake: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
        dir: { x: 1, y: 0 }, nextDir: { x: 1, y: 0 },
        food: { x: 5, y: 5 }, score: 0, best,
        running: false, paused: false, loop: null, speed: 130
    };
    snakeSpawnFood();
    snakeDraw();
}

function snakeSpawnFood() {
    const s = snakeState;
    let tries = 0;
    do {
        s.food = { x: Math.floor(Math.random() * s.COLS), y: Math.floor(Math.random() * s.ROWS) };
        tries++;
    } while (s.snake.some(seg => seg.x === s.food.x && seg.y === s.food.y) && tries < 200);
}

function snakeDraw() {
    const s = snakeState;
    if (!s) return;
    s.ctx.fillStyle = '#0d0f12';
    s.ctx.fillRect(0, 0, s.canvas.width, s.canvas.height);

    // сетка
    s.ctx.strokeStyle = 'rgba(74, 158, 255, 0.06)';
    for (let i = 0; i <= s.COLS; i++) {
        s.ctx.beginPath(); s.ctx.moveTo(i * s.CELL, 0); s.ctx.lineTo(i * s.CELL, s.canvas.height); s.ctx.stroke();
    }
    for (let j = 0; j <= s.ROWS; j++) {
        s.ctx.beginPath(); s.ctx.moveTo(0, j * s.CELL); s.ctx.lineTo(s.canvas.width, j * s.CELL); s.ctx.stroke();
    }

    // еда
    s.ctx.fillStyle = '#ff5c5c';
    s.ctx.beginPath();
    s.ctx.arc(s.food.x * s.CELL + s.CELL / 2, s.food.y * s.CELL + s.CELL / 2, s.CELL / 2 - 2, 0, Math.PI * 2);
    s.ctx.fill();

    // змейка
    s.snake.forEach((seg, i) => {
        s.ctx.fillStyle = i === 0 ? '#4a9eff' : '#2c6bb5';
        s.ctx.beginPath();
        s.ctx.roundRect(seg.x * s.CELL + 1, seg.y * s.CELL + 1, s.CELL - 2, s.CELL - 2, 4);
        s.ctx.fill();
    });

    if (s.paused && s.running) {
        s.ctx.fillStyle = 'rgba(0,0,0,0.7)';
        s.ctx.fillRect(0, 0, s.canvas.width, s.canvas.height);
        s.ctx.fillStyle = '#4a9eff';
        s.ctx.font = 'bold 24px Arial';
        s.ctx.textAlign = 'center';
        s.ctx.fillText('ПАУЗА', s.canvas.width / 2, s.canvas.height / 2);
    }
    if (!s.running) {
        s.ctx.fillStyle = 'rgba(0,0,0,0.6)';
        s.ctx.fillRect(0, 0, s.canvas.width, s.canvas.height);
        s.ctx.fillStyle = '#4a9eff';
        s.ctx.font = 'bold 16px Arial';
        s.ctx.textAlign = 'center';
        s.ctx.fillText('Нажмите «Старт»', s.canvas.width / 2, s.canvas.height / 2);
    }
}

function snakeStep() {
    const s = snakeState;
    if (!s || !s.running || s.paused) return;
    s.dir = { ...s.nextDir };
    const head = { x: s.snake[0].x + s.dir.x, y: s.snake[0].y + s.dir.y };

    if (head.x < 0 || head.x >= s.COLS || head.y < 0 || head.y >= s.ROWS) return snakeGameOver();
    if (s.snake.some(seg => seg.x === head.x && seg.y === head.y)) return snakeGameOver();

    s.snake.unshift(head);
    if (head.x === s.food.x && head.y === s.food.y) {
        s.score += 10;
        document.getElementById('snakeScore').textContent = s.score;
        if (s.score > s.best) {
            s.best = s.score;
            localStorage.setItem('nucleus_snake_best', s.best);
            document.getElementById('snakeBest').textContent = s.best;
        }
        snakeSpawnFood();
        if (s.speed > 60) { s.speed -= 3; clearInterval(s.loop); s.loop = setInterval(snakeStep, s.speed); }
    } else {
        s.snake.pop();
    }
    snakeDraw();
}

function snakeGameOver() {
    const s = snakeState;
    if (!s) return;
    s.running = false;
    clearInterval(s.loop);
    s.loop = null;
    s.ctx.fillStyle = 'rgba(0,0,0,0.8)';
    s.ctx.fillRect(0, 0, s.canvas.width, s.canvas.height);
    s.ctx.fillStyle = '#ff5c5c';
    s.ctx.font = 'bold 22px Arial';
    s.ctx.textAlign = 'center';
    s.ctx.fillText('ИГРА ОКОНЧЕНА', s.canvas.width / 2, s.canvas.height / 2 - 10);
    s.ctx.fillStyle = '#4a9eff';
    s.ctx.font = '16px Arial';
    s.ctx.fillText('Счёт: ' + s.score, s.canvas.width / 2, s.canvas.height / 2 + 20);
}

function snakeStart() {
    const s = snakeState;
    if (!s) return;
    if (s.paused) { s.paused = false; snakeDraw(); return; }
    snakeReset();
    s.running = true;
    s.speed = 130;
    s.loop = setInterval(snakeStep, s.speed);
    snakeDraw();
}

function snakePauseToggle() {
    const s = snakeState;
    if (!s || !s.running) return;
    s.paused = !s.paused;
    snakeDraw();
}

function snakeReset() {
    const s = snakeState;
    if (!s) return;
    clearInterval(s.loop);
    s.loop = null;
    s.snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    s.dir = { x: 1, y: 0 }; s.nextDir = { x: 1, y: 0 };
    s.score = 0; s.running = false; s.paused = false;
    document.getElementById('snakeScore').textContent = '0';
    snakeSpawnFood();
    snakeDraw();
}

   ============================================================ */
async function openCamera() {
    const content = `
        <div style="padding:14px; height:100%; display:flex; flex-direction:column; gap:10px;">
            <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:8px; background:#000; flex:1; object-fit:cover;"></video>
            <div style="display:flex; gap:8px; justify-content:center;">
                <button onclick="cameraSnap()" style="background:var(--accent); border:none; color:#fff; padding:8px 18px; border-radius:6px; cursor:pointer;">📸 Снимок</button>
                <button onclick="cameraOff()" style="background:var(--bg-3); border:1px solid var(--border); color:var(--text); padding:8px 18px; border-radius:6px; cursor:pointer;">⏹ Стоп</button>
            </div>
            <canvas id="cameraCanvas" style="display:none;"></canvas>
            <div id="cameraPreview" style="font-size:11px; color:var(--text-dim); text-align:center;">Разрешите доступ к камере</div>
        </div>
    `;
    createWindow({ title: 'Камера', icon: '📷', content, width: 560, height: 480, appId: 'camera' });
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('cameraVideo');
        if (video) {
            video.srcObject = stream;
            window._cameraStream = stream;
            document.getElementById('cameraPreview').textContent = 'Камера активна';
        }
    } catch (e) {
        const p = document.getElementById('cameraPreview');
        if (p) p.innerHTML = '<span style="color:var(--warn);">Камера недоступна: ' + e.message + '</span>';
    }
}

function cameraSnap() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('cameraCanvas');
    if (!video || !canvas || !video.videoWidth) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/png');
    // открываем снимок в новом окне
    const content = `<div style="padding:10px; text-align:center;"><img src="${dataUrl}" style="max-width:100%; border-radius:6px;"></div>`;
    createWindow({ title: 'Снимок', icon: '🖼️', content, width: 500, height: 400, appId: 'snapshot' });
    notify('Камера', 'Снимок сделан!');
}

function cameraOff() {
    if (window._cameraStream) {
        window._cameraStream.getTracks().forEach(t => t.stop());
        window._cameraStream = null;
    }
    const v = document.getElementById('cameraVideo');
    if (v) v.srcObject = null;
}

        el.className = 'launcher-item' + (i === 0 ? ' selected' : '');

/* ---------- ЗВУКОВОЙ ДВИЖОК ---------- */
const Sound = (function() {
    let ctx = null;
    let enabled = true;
    let volume = 0.5;

    function ensureCtx() {
        if (!ctx) {
            try {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { console.warn('AudioContext недоступен'); }
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function tone(freq, duration, type, vol, delay) {
        if (!enabled) return;
        const c = ensureCtx();
        if (!c) return;
        const t0 = c.currentTime + (delay || 0);
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime((vol || 0.3) * volume, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(t0);
        osc.stop(t0 + duration + 0.05);
    }

    return {
        click:       () => tone(880, 0.06, 'square', 0.15),
        open:        () => { tone(660, 0.08, 'sine', 0.2); tone(990, 0.1, 'sine', 0.15, 0.05); },
        close:       () => { tone(660, 0.08, 'sine', 0.15); tone(330, 0.12, 'sine', 0.12, 0.05); },
        notify:      () => { tone(880, 0.1, 'sine', 0.25); tone(1174, 0.15, 'sine', 0.2, 0.08); },
        error:       () => { tone(220, 0.15, 'sawtooth', 0.25); tone(180, 0.2, 'sawtooth', 0.2, 0.12); },
        welcome:     () => {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((f, i) => tone(f, 0.4, 'sine', 0.25, i * 0.15));
        },
        startup:     () => {
            [392, 523.25, 659.25].forEach((f, i) => tone(f, 0.5, 'triangle', 0.3, i * 0.18));
        },
        shutdown:    () => {
            [523.25, 392, 261.63].forEach((f, i) => tone(f, 0.5, 'triangle', 0.3, i * 0.18));
        },
        success:     () => { tone(659.25, 0.1, 'sine', 0.25); tone(880, 0.15, 'sine', 0.22, 0.1); },
        setEnabled:  (v) => { enabled = v; },
        isEnabled:   () => enabled,
        setVolume:   (v) => { volume = Math.max(0, Math.min(1, v)); },
        getVolume:   () => volume
    };
})();

   СВОЯ МУЗЫКА (загрузка mp3 из файла)
   ============================================================ */
const CustomMusic = {
    audio: null,
    playlist: [],
    currentIdx: -1,
    key: 'nucleus_music_playlist',

    init() {
        this.audio = new Audio();
        this.audio.volume = 0.7;
        this.audio.addEventListener('ended', () => this.next());
        try {
            const saved = JSON.parse(localStorage.getItem(this.key) || '[]');
            this.playlist = saved;
        } catch (e) { this.playlist = []; }
    },

    save() {
        try {
            localStorage.setItem(this.key, JSON.stringify(this.playlist));
        } catch (e) { notify('Музыка', 'Плейлист слишком большой для сохранения'); }
    },

    add() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'audio/*';
        input.multiple = true;
        input.onchange = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.size > 5 * 1024 * 1024) {
                    notify('Музыка', `Файл ${file.name} слишком большой (макс. 5 МБ)`);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    this.playlist.push({ name: file.name, data: ev.target.result });
                    this.save();
                    notify('Музыка', `Добавлено: ${file.name}`);
                    if (this.currentIdx === -1) this.play(0);
                    // обновить окно плеера, если открыто
                    if (window._musicWindowRefresh) window._musicWindowRefresh();
                };
                reader.readAsDataURL(file);
            });
        };
        input.click();
    },

    play(idx) {
        if (idx < 0 || idx >= this.playlist.length) return;
        this.currentIdx = idx;
        this.audio.src = this.playlist[idx].data;
        this.audio.play().catch(e => notify('Музыка', 'Не удалось воспроизвести'));
        if (window._musicWindowRefresh) window._musicWindowRefresh();
    },

    toggle() {
        if (this.currentIdx === -1 && this.playlist.length) return this.play(0);
        if (this.audio.paused) this.audio.play();
        else this.audio.pause();
        if (window._musicWindowRefresh) window._musicWindowRefresh();
    },

    next() {
        if (!this.playlist.length) return;
        const next = (this.currentIdx + 1) % this.playlist.length;
        this.play(next);
    },

    prev() {
        if (!this.playlist.length) return;
        const prev = (this.currentIdx - 1 + this.playlist.length) % this.playlist.length;
        this.play(prev);
    },

    remove(idx) {
        this.playlist.splice(idx, 1);
        if (this.currentIdx >= this.playlist.length) this.currentIdx = this.playlist.length - 1;
        if (this.currentIdx < 0) { this.audio.pause(); this.audio.src = ''; }
        this.save();
        if (window._musicWindowRefresh) window._musicWindowRefresh();
    },

    clear() {
        this.playlist = [];
        this.currentIdx = -1;
        this.audio.pause();
        this.audio.src = '';
        this.save();
        if (window._musicWindowRefresh) window._musicWindowRefresh();
    }
};

let paintTool = 'brush';
let paintDrawing = false;

function paintInit() {
    const canvas = document.getElementById('paintCanvas');
    if (!canvas) return;
    // подгоняем размер canvas под контейнер
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight - 50;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const colorInput = document.getElementById('paintColor');
    const sizeInput = document.getElementById('paintSize');
    const sizeLabel = document.getElementById('paintSizeLabel');

    sizeInput.addEventListener('input', () => sizeLabel.textContent = sizeInput.value + ' px');

    let lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', (e) => {
        paintDrawing = true;
        const rect = canvas.getBoundingClientRect();
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        if (paintTool === 'brush' || paintTool === 'eraser') {
            ctx.beginPath();
            ctx.arc(lastX, lastY, parseInt(sizeInput.value) / 2, 0, Math.PI * 2);
            ctx.fillStyle = paintTool === 'eraser' ? '#fff' : colorInput.value;
            ctx.fill();
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!paintDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (paintTool === 'brush' || paintTool === 'eraser') {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = paintTool === 'eraser' ? '#fff' : colorInput.value;
            ctx.lineWidth = parseInt(sizeInput.value);
            ctx.stroke();
            lastX = x; lastY = y;
        } else if (paintTool === 'line') {
            // для линии показываем preview — перерисовываем полностью сложно, поэтому просто рисуем линию
            // при отпускании зафиксируем. Здесь используем простой приём: сохраняем imageData
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (paintTool === 'line' && paintDrawing) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = colorInput.value;
            ctx.lineWidth = parseInt(sizeInput.value);
            ctx.stroke();
        }
        paintDrawing = false;
    });

    canvas.addEventListener('mouseleave', () => paintDrawing = false);
}

function codeRun() {
    const area = document.getElementById('codeArea');
    const cons = document.getElementById('codeConsole');
    if (!area || !cons) return;
    cons.innerHTML = '';
    const originalLog = console.log;
    console.log = function(...args) {
        cons.innerHTML += args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ') + '\n';
        originalLog.apply(console, args);
    };
    try {
        new Function(area.value)();
        cons.innerHTML += '<span style="color:#4ade80;">✓ Выполнено</span>\n';
    } catch (e) {
        cons.innerHTML += `<span style="color:#ff5c5c;">✗ ${e.message}</span>\n`;
    }
    console.log = originalLog;
    Sound.click();
}
